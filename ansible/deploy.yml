---
- name: Deploy Application
  hosts: all
  vars:
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"

  tasks:
    - name: Pull and start containers
      shell: |
        IMAGE_TAG={{ image_tag }} docker compose -f docker-compose.prod.yml up -d --force-recreate

    - name: Run healthcheck
      shell: |
        bash scripts/healthcheck.sh localhost 80
      register: health_result
      ignore_errors: yes

    - name: Trigger Rollback if Healthcheck Fails
      shell: |
        bash scripts/rollback.sh {{ previous_tag | default('latest') }}
      when: health_result.rc != 0
      failed_when: true
      